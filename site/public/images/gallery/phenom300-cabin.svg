      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="url(#cabin7)"/>
  <!-- Phenom 300 cabin -->
  <rect x="100" y="280" width="180" height="110" rx="8" fill="#94a3b8" opacity="0.5"/>
  <rect x="320" y="280" width="180" height="110" rx="8" fill="#94a3b8" opacity="0.5"/>
  <rect x="540" y="280" width="180" height="110" rx="8" fill="#94a3b8" opacity="0.5"/>
  <rect x="760" y="280" width="180" height="110" rx="8" fill="#94a3b8" opacity="0.5"/>
  <!-- Headrests -->
  <rect x="130" y="230" width="120" height="60" rx="10" fill="#64748b"/>
  <rect x="350" y="230" width="120" height="60" rx="10" fill="#64748b"/>
  <rect x="570" y="230" width="120" height="60" rx="10" fill="#64748b"/>
  <rect x="790" y="230" width="120" height="60" rx="10" fill="#64748b"/>
  <!-- Tables -->
  <rect x="160" y="410" width="120" height="25" rx="3" fill="#cbd5e1" opacity="0.5"/>
  <rect x="380" y="410" width="120" height="25" rx="3" fill="#cbd5e1" opacity="0.5"/>
  <rect x="600" y="410" width="120" height="25" rx="3" fill="#cbd5e1" opacity="0.5"/>
  <rect x="820" y="410" width="120" height="25" rx="3" fill="#cbd5e1" opacity="0.5"/>
