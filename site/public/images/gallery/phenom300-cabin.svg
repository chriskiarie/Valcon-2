  <circle cx="600" cy="90" r="28" fill="#dbeafe" opacity="0.6"/>
  <circle cx="820" cy="90" r="28" fill="#dbeafe" opacity="0.6"/>
  <!-- Text -->
  <text x="600" y="380" font-family="sans-serif" font-size="24" font-weight="600" fill="#1e293b" text-anchor="middle">Embraer Phenom 300 Cabin</text>
  <text x="600" y="410" font-family="sans-serif" font-size="16" font-weight="400" fill="#64748b" text-anchor="middle">7-Seat Light Jet Configuration</text>
