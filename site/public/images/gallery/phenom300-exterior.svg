  <!-- Text -->
  <text x="600" y="260" font-family="sans-serif" font-size="24" font-weight="600" fill="#1e293b" text-anchor="middle">Embraer Phenom 300 Exterior</text>
  <text x="600" y="290" font-family="sans-serif" font-size="16" font-weight="400" fill="#64748b" text-anchor="middle">N600EM  •  Side Profile</text>
