  <defs>
    <linearGradient id="cabin9" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="url(#cabin9)"/>
  <!-- Phenom 300 exterior side view -->
  <rect x="50" y="250" width="1100" height="200" rx="30" fill="#cbd5e1" opacity="0.3"/>
