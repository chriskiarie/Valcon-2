  <!-- Windows -->
  <circle cx="200" cy="350" r="20" fill="#dbeafe" opacity="0.7"/>
  <circle cx="320" cy="350" r="20" fill="#dbeafe" opacity="0.7"/>
  <circle cx="440" cy="350" r="20" fill="#dbeafe" opacity="0.7"/>
  <circle cx="560" cy="350" r="20" fill="#dbeafe" opacity="0.7"/>
