<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
  <defs>
    <linearGradient id="cabin5" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="url(#cabin5)"/>
  <!-- G650 aft cabin -->
  <rect x="100" y="300" width="280" height="180" rx="12" fill="#475569" opacity="0.25"/>
  <rect x="420" y="300" width="280" height="180" rx="12" fill="#475569" opacity="0.25"/>
  <rect x="740" y="300" width="280" height="180" rx="12" fill="#475569" opacity="0.25"/>
  <!-- Divan seating -->
  <rect x="140" y="330" width="200" height="120" rx="8" fill="#334155" opacity="0.4"/>
  <rect x="460" y="330" width="200" height="120" rx="8" fill="#334155" opacity="0.4"/>
  <rect x="780" y="330" width="200" height="120" rx="8" fill="#334155" opacity="0.4"/>
  <!-- Galley area -->
  <rect x="960" y="300" width="140" height="300" rx="8" fill="#475569" opacity="0.3"/>
  <rect x="980" y="340" width="100" height="220" fill="#e2e8f0" opacity="0.6"/>
  <!-- Windows -->
  <circle cx="180" cy="100" r="32" fill="#dbeafe" opacity="0.7"/>
  <circle cx="500" cy="100" r="32" fill="#dbeafe" opacity="0.7"/>
  <circle cx="820" cy="100" r="32" fill="#dbeafe" opacity="0.7"/>
  <!-- Text -->
  <text x="600" y="380" font-family="sans-serif" font-size="28" font-weight="700" fill="#1e293b" text-anchor="middle">Gulfstream G650 Aft Cabin</text>
  <text x="600" y="410" font-family="sans-serif" font-size="18" font-weight="400" fill="#64748b" text-anchor="middle">Aft Divan &amp; Galley Configuration</text>
</svg>
