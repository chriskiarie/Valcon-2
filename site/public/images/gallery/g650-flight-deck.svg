<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
  <defs>
    <linearGradient id="cabin6" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="url(#cabin6)"/>
  <!-- Flight deck -->
  <rect x="100" y="150" width="500" height="350" rx="12" fill="#cbd5e1" opacity="0.3"/>
  <!-- Primary flight display -->
  <rect x="150" y="200" width="150" height="200" rx="4" fill="#0f172a"/>
  <rect x="170" y="220" width="110" height="160" fill="#1e293b"/>
  <!-- Navigation display -->
  <rect x="330" y="200" width="150" height="200" rx="4" fill="#0f172a"/>
  <rect x="350" y="220" width="110" height="160" fill="#1e293b"/>
  <!-- Engine indicators -->
  <rect x="510" y="200" width="150" height="200" rx="4" fill="#0f172a"/>
  <rect x="530" y="220" width="110" height="160" fill="#1e293b"/>
  <!-- Control yokes -->
  <rect x="220" y="450" width="80" height="60" rx="4" fill="#475569"/>
  <rect x="380" y="450" width="80" height="60" rx="4" fill="#475569"/>
  <!-- Throttle quadrant -->
  <rect x="280" y="550" width="240" height="40" rx="8" fill="#334155"/>
  <!-- Text -->
  <text x="600" y="350" font-family="sans-serif" font-size="28" font-weight="700" fill="#1e293b" text-anchor="middle">Gulfstream G650 Flight Deck</text>
  <text x="600" y="380" font-family="sans-serif" font-size="18" font-weight="400" fill="#64748b" text-anchor="middle">Advanced Avionics Suite</text>
</svg>
