  </defs>
  <rect width="100%" height="100%" fill="url(#cabin3)"/>
  <!-- Forward cabin -->
  <rect x="100" y="300" width="220" height="140" rx="8" fill="#cbd5e1" opacity="0.7"/>
  <rect x="360" y="300" width="220" height="140" rx="8" fill="#cbd5e1" opacity="0.7"/>
  <rect x="620" y="300" width="220" height="140" rx="8" fill="#cbd5e1" opacity="0.7"/>
