  <!-- Headrests -->
  <rect x="150" y="250" width="120" height="60" rx="12" fill="#94a3b8"/>
  <rect x="410" y="250" width="120" height="60" rx="12" fill="#94a3b8"/>
  <rect x="670" y="250" width="120" height="60" rx="12" fill="#94a3b8"/>
