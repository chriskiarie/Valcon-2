<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
  <defs>
    <linearGradient id="cabin1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="url(#cabin1)"/>
  <!-- Cabin seats -->
  <rect x="100" y="200" width="200" height="120" rx="8" fill="#cbd5e1" opacity="0.6"/>
  <rect x="350" y="200" width="200" height="120" rx="8" fill="#cbd5e1" opacity="0.6"/>
  <rect x="600" y="200" width="200" height="120" rx="8" fill="#cbd5e1" opacity="0.6"/>
  <rect x="850" y="200" width="200" height="120" rx="8" fill="#cbd5e1" opacity="0.6"/>
  <!-- Seat headrests -->
  <rect x="140" y="160" width="120" height="50" rx="10" fill="#94a3b8"/>
  <rect x="390" y="160" width="120" height="50" rx="10" fill="#94a3b8"/>
  <rect x="640" y="160" width="120" height="50" rx="10" fill="#94a3b8"/>
  <rect x="890" y="160" width="120" height="50" rx="10" fill="#94a3b8"/>
  <!-- Windows -->
  <circle cx="150" cy="100" r="30" fill="#dbeafe" opacity="0.6"/>
  <circle cx="400" cy="100" r="30" fill="#dbeafe" opacity="0.6"/>
  <circle cx="650" cy="100" r="30" fill="#dbeafe" opacity="0.6"/>
  <circle cx="900" cy="100" r="30" fill="#dbeafe" opacity="0.6"/>
  <!-- Overhead bins -->
  <rect x="100" y="50" width="950" height="80" rx="8" fill="#e2e8f0"/>
  <path d="M100,50 L150,30 L1050,30 L1100,50 Z" fill="#cbd5e1"/>
  <!-- Aisle -->
  <rect x="500" y="330" width="200" height="400" fill="#f1f5f9"/>
  <!-- Text -->
  <text x="600" y="400" font-family="sans-serif" font-size="24" font-weight="600" fill="#1e293b" text-anchor="middle">CRJ200 LR Cabin</text>
  <text x="600" y="430" font-family="sans-serif" font-size="16" font-weight="400" fill="#64748b" text-anchor="middle">50-Seat Regional Configuration</text>
</svg>
