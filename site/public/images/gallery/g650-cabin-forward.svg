<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
  <defs>
    <linearGradient id="cabin4" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="url(#cabin4)"/>
  <!-- G650 forward cabin - luxury -->
  <rect x="100" y="250" width="300" height="200" rx="12" fill="#475569" opacity="0.3"/>
  <rect x="450" y="250" width="300" height="200" rx="12" fill="#475569" opacity="0.3"/>
  <rect x="800" y="250" width="300" height="200" rx="12" fill="#475569" opacity="0.3"/>
  <!-- Leather seat details -->
  <rect x="140" y="280" width="220" height="140" rx="8" fill="#334155" opacity="0.5"/>
  <rect x="490" y="280" width="220" height="140" rx="8" fill="#334155" opacity="0.5"/>
  <rect x="840" y="280" width="220" height="140" rx="8" fill="#334155" opacity="0.5"/>
  <!-- Tables -->
  <rect x="180" y="440" width="140" height="30" rx="4" fill="#94a3b8" opacity="0.4"/>
  <rect x="530" y="440" width="140" height="30" rx="4" fill="#94a3b8" opacity="0.4"/>
  <rect x="880" y="440" width="140" height="30" rx="4" fill="#94a3b8" opacity="0.4"/>
  <!-- Windows -->
  <circle cx="180" cy="120" r="35" fill="#dbeafe" opacity="0.7"/>
  <circle cx="530" cy="120" r="35" fill="#dbeafe" opacity="0.7"/>
  <circle cx="880" cy="120" r="35" fill="#dbeafe" opacity="0.7"/>
  <!-- Text -->
  <text x="600" y="360" font-family="sans-serif" font-size="28" font-weight="700" fill="#1e293b" text-anchor="middle">Gulfstream G650 Cabin</text>
  <text x="600" y="390" font-family="sans-serif" font-size="18" font-weight="400" fill="#64748b" text-anchor="middle">14-Seat Luxury Long-Range Configuration</text>
</svg>
